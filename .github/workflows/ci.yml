name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: services/worker/go.sum }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: scripts/stack.sh start
      - run: pnpm e2e
      - if: failure()
        run: scripts/stack.sh logs
      - if: always()
        run: scripts/stack.sh stop

  gates:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Policy gates
        id: gates
        run: |
          set +e
          node tools/gates/check.mjs --base origin/${{ github.base_ref }} | tee gates.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          { echo '### Policy gates'; echo '```'; cat gates.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Reason: exit 3 (protected paths) is not a failure; the needs-human-review job turns it into a required approval.
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0
    outputs:
      code: ${{ steps.gates.outputs.code }}

  needs-human-review:
    runs-on: ubuntu-latest
    needs: gates
    if: needs.gates.outputs.code == '3'
    # Reason: configure the "protected-change" environment with required reviewers so a
    # person must approve before this check goes green.
    environment: protected-change
    steps:
      - run: echo "A person approved a change to protected paths."
