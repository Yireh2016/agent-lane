name: agent-lane

# Runs the orchestrator when an issue gets the agent-lane label, and every weekday morning
# to pick up answers, reviews and validation results. Off until the repo has the
# ANTHROPIC_API_KEY secret and the LANE_ENABLED=true variable.
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: agent-lane
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    if: vars.LANE_ENABLED == 'true' && (github.event_name != 'issues' || github.event.label.name == 'agent-lane')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: services/worker/go.sum }
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/lane-orchestrator"
