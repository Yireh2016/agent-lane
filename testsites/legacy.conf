# Valid certificate from the local CA and every header, but still accepts TLS 1.0 and 1.1.
server {
  listen 443 ssl;
  server_name legacysite;
  ssl_certificate     /certs/legacysite.pem;
  ssl_certificate_key /certs/legacysite.key;
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
  # Reason: OpenSSL 3 refuses TLS 1.0/1.1 at the default security level.
  ssl_ciphers DEFAULT:@SECLEVEL=0;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  location / { return 200 "legacysite\n"; }
}
